# The robot: keeps a next round ready. Every 15 minutes (and when a page sees a round end) it asks the Referee about
# the current round and the prepared one. A settled current round is replaced by the prepared one; a missing prepared
# round is deployed (paid by the deploy wallet). The new files are committed to main; Cloudflare publishes them and
# the Referee picks them up by itself (FUNGE_GAMES_URL). Render is only restarted when the Referee has not picked a
# file up for 5 minutes. Run it by hand from the Actions tab too.
# The 15-minute schedule runs both networks, side by side; a run by hand (or from a page) runs the one network chosen.
# Each network has its own secrets:
#   chipnet: FUNGE_DEPLOY_SEED, RENDER_DEPLOY_HOOK
#   mainnet: FUNGE_DEPLOY_SEED_MAINNET, RENDER_DEPLOY_HOOK_MAINNET (deploy wallet seed phrase; Render's deploy hook link)
name: Next round

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Network"
        type: choice
        options: [chipnet, mainnet]
        default: chipnet
      replace_unopened:
        description: "Rule change: replace the prepared round, and the current one if nobody has opened it"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  next-round:
    strategy:
      fail-fast: false # one network failing must not stop the other
      matrix:
        network: ${{ github.event_name == 'schedule' && fromJSON('["chipnet","mainnet"]') || fromJSON(format('["{0}"]', inputs.network || 'chipnet')) }}
    # Never two runs at once for one network: two robots could each deploy a round.
    concurrency:
      group: next-round-${{ matrix.network }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FUNGE_NETWORK: ${{ matrix.network }}
      REFEREE: ${{ matrix.network == 'mainnet' && 'https://referee-mainnet.funge.cash' || 'https://referee.funge.cash' }}
    steps:
      # main as it is now, not as it was when this run was queued: an earlier run may have just pushed a new round
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - name: Check the rounds; promote the prepared one, prepare the next
        id: round
        # The seed is chosen in the shell: a missing mainnet secret must fail, never fall back to the chipnet one
        run: |
          if [ "$VITE_FUNGE_NETWORK" = mainnet ]; then FUNGE_DEPLOY_SEED="$SEED_MAINNET"; else FUNGE_DEPLOY_SEED="$SEED_CHIPNET"; fi
          [ -n "$FUNGE_DEPLOY_SEED" ] || { echo "The deploy wallet secret for $VITE_FUNGE_NETWORK is not set."; exit 1; }
          export FUNGE_DEPLOY_SEED
          node scripts/next-round.ts "$REFEREE" ${{ inputs.replace_unopened && '--replace-unopened' || '' }}
        env:
          SEED_CHIPNET: ${{ secrets.FUNGE_DEPLOY_SEED }}
          SEED_MAINNET: ${{ secrets.FUNGE_DEPLOY_SEED_MAINNET }}

      - name: Commit the round files
        if: steps.round.outputs.action == 'deployed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A -- "public/game.$VITE_FUNGE_NETWORK.kingdom.json" "public/game.$VITE_FUNGE_NETWORK.next.json"
          git commit -m "Next round: round files ($VITE_FUNGE_NETWORK)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Restart the Referee (only when it has not picked up a round file)
        if: steps.round.outputs.redeploy == 'yes'
        # ref = this exact commit: without it Render may deploy the commit before the robot's push.
        run: |
          if [ "$VITE_FUNGE_NETWORK" = mainnet ]; then HOOK="$HOOK_MAINNET"; else HOOK="$HOOK_CHIPNET"; fi
          [ -n "$HOOK" ] || { echo "The Render deploy hook for $VITE_FUNGE_NETWORK is not set."; exit 1; }
          curl -fsS -X POST "$HOOK&ref=$(git rev-parse HEAD)" > /dev/null && echo "Render deploy of $(git rev-parse --short HEAD) started."
        env:
          HOOK_CHIPNET: ${{ secrets.RENDER_DEPLOY_HOOK }}
          HOOK_MAINNET: ${{ secrets.RENDER_DEPLOY_HOOK_MAINNET }}
